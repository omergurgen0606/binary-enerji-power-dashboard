services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # 1883 BILEREK YAYINLANMIYOR. Cihazlar 8883'ten TLS ile baglanir; duz
      # metin 1883'te broker parolasi her baglantida acik gidiyor ve tum
      # telemetri yolda okunabiliyordu. API broker'a docker agindan
      # (MQTT_BROKER=mosquitto) ulastigi icin ic trafik bundan etkilenmiyor --
      # 1883 konteyner icinde hala dinliyor, sadece disariya acilmiyor.
      - "8883:8883"
    volumes:
      - /etc/mosquitto/conf.d/default.conf:/mosquitto/config/mosquitto.conf:ro
      # rw: cihaz-basina MQTT kaydi (ops/mosquitto_kayit_uygula.sh) bu dosyayi
      # mosquitto_passwd araciyla, konteyner icinden guncelliyor. ro iken
      # "Read-only file system" hatasiyla basarisiz oluyordu.
      - /etc/mosquitto/passwd:/etc/mosquitto/passwd
      # TLS sertifikalari. Bu baglama olmadan mosquitto sertifikayi bulamaz,
      # acilista hata verip CIKAR ve broker cokme dongusune girer -- yani
      # eksikligi sessiz degil, tam kesinti demek.
      - /etc/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - power_net

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - power_net

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - timescaledb
      - mosquitto
    environment:
      DB_HOST: timescaledb
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: mosquitto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      DEVICE_CLAIM_SECRET: ${DEVICE_CLAIM_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/google-service-account.json
    volumes:
      - /root/google-service-account.json:/app/google-service-account.json:ro
      - avatar_uploads:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - power_net

  # Staging: üretimle AYNI imaj, AYNI mosquitto akışı, AYRI veritabanı.
  #
  # Aynı MQTT akışını dinlemesi kasıtlı -- gerçek cihaz verisiyle test etmenin
  # tek yolu bu. Ama bu yakınlık tehlikeli olurdu: api.py içindeki STAGING=1
  # koruması e-posta, push bildirimi ve cihaz komutlarını kapatıyor, yani
  # staging okur ama dış dünyaya hiçbir şey yazmaz (bkz. tests/test_staging.py).
  #
  # Avatar birimi de ayrı: paylaşılsaydı staging'de yüklenen bir dosya
  # üretimdeki kullanıcının avatarının üstüne yazardı.
  api-staging:
    build: .
    restart: unless-stopped
    depends_on:
      - timescaledb
      - mosquitto
    environment:
      DB_HOST: timescaledb
      POSTGRES_DB: binaryenerji_staging
      STAGING: "1"
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: mosquitto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      DEVICE_CLAIM_SECRET: ${DEVICE_CLAIM_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/google-service-account.json
    volumes:
      - /root/google-service-account.json:/app/google-service-account.json:ro
      - avatar_uploads_staging:/app/uploads
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - power_net

networks:
  power_net:

volumes:
  timescale_data:
    external: true
  mosquitto_data:
  mosquitto_log:
  avatar_uploads:
  avatar_uploads_staging:
