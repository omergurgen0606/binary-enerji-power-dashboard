# Binary Enerji — MQTT broker yapılandırması
#
# İki dinleyici, farklı güven sınırları için:
#
#   1883 — API ↔ broker. Docker ağı üzerinden konuşuyorlar (MQTT_BROKER=mosquitto),
#          trafik VPS'ten hiç çıkmıyor. Cihazlar eski firmware'le hâlâ buradan
#          bağlanabildiği için host'a yayınlanmaya devam ediyor; tüm cihazlar
#          TLS'e geçtikten sonra docker-compose'daki "1883:1883" yayını
#          kaldırılmalı ve port yalnızca iç ağda kalmalı.
#
#   8883 — Cihazlar. Bu bağlantı açık internetten geçiyor. TLS'siz hâlde broker
#          parolası her bağlantıda düz metin gidiyordu ve tüm müşteri telemetrisi
#          yolda okunabiliyordu.
#
# Sertifikalar Let's Encrypt'ten, ops/mosquitto_sertifika_senkron.sh ile
# kopyalanıyor (mosquitto uid 1883 özel anahtarı doğrudan okuyamıyor).

allow_anonymous false
password_file /etc/mosquitto/passwd

listener 1883

listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
