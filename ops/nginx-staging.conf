# Staging — https://binaryenerji.com:8443
#
# Ayrı bir alt alan adı (staging.binaryenerji.com) yerine farklı bir PORT
# kullanılıyor: DNS kaydı eklemeye gerek kalmıyor ve mevcut sertifika
# binaryenerji.com'u zaten kapsadığı için staging de HTTPS oluyor. Düz HTTP
# bir staging'e gerçek şifre yazılması kabul edilebilir değildi.
#
# 8443 portunun sunucu güvenlik duvarında açık olması gerekir:
#   ufw allow 8443/tcp
server {
    listen 8443 ssl;
    server_name binaryenerji.com www.binaryenerji.com;

    ssl_certificate /etc/letsencrypt/live/binaryenerji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/binaryenerji.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Arama motorları staging'i indekslemesin.
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/dashboard-staging;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 8001 = api-staging konteyneri (üretim 8000'de).
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
