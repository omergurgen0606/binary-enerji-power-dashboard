server {
    listen 80;
    server_name binaryenerji.com www.binaryenerji.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name binaryenerji.com www.binaryenerji.com;

    ssl_certificate /etc/letsencrypt/live/binaryenerji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/binaryenerji.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dashboard;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Firmware .bin dosyalari 1 MB'in uzerinde; nginx'in varsayilan siniri
        # 1 MB oldugu icin OTA yuklemesi 413 ile reddediliyordu -- yani OTA
        # hicbir zaman calisamamisti. API kendi tarafinda 4 MB sinir koyuyor.
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
